services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_library
    ports:
      - '5432:5432'
    volumes:
      - digital-library-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d digital_library']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  digital-library-postgres-data:
